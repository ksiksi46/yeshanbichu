<script type="text/javascript">
    // 显示当前日期
    (function() {
        var dateObj = new Date();
        var year = dateObj.getFullYear();
        var month = dateObj.getMonth() + 1;
        var date = dateObj.getDate();
        var dayArr = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
        var day = dayArr[dateObj.getDay()];
        var dateSpan = document.getElementById("date-str");
        if(dateSpan) dateSpan.innerHTML = year + "年" + month + "月" + date + "日 " + day;
    })();

    // 返回顶部按钮显示隐藏
    window.addEventListener('scroll', function() {
        var goTop = document.getElementById('goTop');
        if (goTop) {
            if (window.scrollY > 300) goTop.style.display = 'block';
            else goTop.style.display = 'none';
        }
    });

    // 倒计时: 一日后
    function startCountdown() {
        const now = new Date();
        const target = new Date(now);
        target.setDate(target.getDate() + 1);
        
        function updateTimer() {
            const current = new Date();
            const diffMs = target - current;
            if (diffMs <= 0) {
                const timerSpan = document.getElementById('countdownTimer');
                if (timerSpan) timerSpan.innerHTML = "祈福大典正在进行";
                return;
            }
            const totalSeconds = Math.floor(diffMs / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const timerSpan = document.getElementById('countdownTimer');
            if (timerSpan) {
                timerSpan.innerHTML = `${hours.toString().padStart(2, '0')} 时 ${minutes.toString().padStart(2, '0')} 分 ${seconds.toString().padStart(2, '0')} 秒`;
            }
        }
        updateTimer();
        setInterval(updateTimer, 1000);
    }
    
    // 接收URL参数
    (function initFromParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const recordTitle = urlParams.get('title');
        if (recordTitle) {
            const sealDiv = document.querySelector('.seal-mark');
            if (sealDiv) {
                const extraRef = document.createElement('div');
                extraRef.style.marginTop = '8px';
                extraRef.style.fontSize = '12px';
                extraRef.style.color = '#888';
                extraRef.innerHTML = `※ 承应「${decodeURIComponent(recordTitle)}」名录 · 吉日相衔`;
                sealDiv.appendChild(extraRef);
            }
        }
    })();
    
    startCountdown();
</script>
