<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>沉痛悼念李寿单老先生千古</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 使用本地背景图片：user/背景.webp 作为全幅背景，庄重肃穆 */
        body {
            background-image: url('user/背景.webp');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center center;
            background-size: cover;
            font-family: "SimSun", "宋体", "Times New Roman", serif;
            text-align: center;
            line-height: 1.8;
            color: #000000;
            position: relative;
        }

        /* 极淡透明白色柔光层，提升文字阅读性 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.12);
            pointer-events: none;
            z-index: 0;
        }

        /* 主容器 */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0px 20px 60px 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(0.5px);
        }

        /* ========= 左右两侧花圈固定位置样式 ========= */
      /* ========= 左右两侧花圈固定位置样式 - 上下分布 ========= */
.side-wreaths {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;     /* 垂直排列 */
    justify-content: center;    /* 垂直居中 */
    align-items: center;
    gap: 20px;                  /* 花圈之间的间距 */
}

.left-wreaths {
    left: 20px;
}

.right-wreaths {
    right: 20px;
}

.side-wreath-item {
    width: 250px;
    opacity: 0.9;
    transition: opacity 0.3s;
    filter: saturate(180%);
    display: block;
}

.side-wreath-item:hover {
    opacity: 1;
}

/* 响应式：小屏幕时缩小侧边花圈 */
@media (max-width: 1200px) {
    .side-wreaths {
        gap: 15px;
    }
    .side-wreath-item {
        width: 70px;
    }
    .left-wreaths {
        left: 10px;
    }
    .right-wreaths {
        right: 10px;
    }
}

@media (max-width: 900px) {
    .side-wreaths {
        gap: 10px;
    }
    .side-wreath-item {
        width: 55px;
    }
}

@media (max-width: 700px) {
    .side-wreaths {
        display: none;
    }
}

        /* ========= 顶部横铺图片样式 ========= */
        .top-banner {
            width: calc(100% + 40px);
            margin-left: -20px;
            margin-right: -20px;
            margin-bottom: 20px;
            text-align: center;
            background: transparent;
            border-bottom: 2px solid rgba(0, 0, 0, 0.15);
            padding-bottom: 10px;
            padding-left: 0;
            padding-right: 0;
            overflow: hidden;
        }
        .top-banner-img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
            border-radius: 0px;
        }

        /* 巨大奠字 */
        .dian-zi {
            font-size: 170px;
            font-weight: bold;
            color: #000000;
            margin: 15px 0 5px 0;
            letter-spacing: 20px;
            text-shadow: 4px 4px 12px rgba(0, 0, 0, 0.25);
            line-height: 1;
        }

        /* 遗像框 */
        .portrait {
            width: 280px;
            height: 380px;
            margin: 20px auto;
            border: 12px solid #DC143C;
            box-shadow: 0 0 30px 8px rgba(220, 20, 60, 0.6);
            object-fit: cover;
            display: block;
            background-color: #eaeaea;
        }

        /* 中间花圈对称布局 */
        .wreath-area {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 10px 0;
        }
        .wreath {
            width: 220px;
            filter: saturate(200%);
            transition: transform 0.2s;
        }

        /* 标题样式 */
        .title {
            font-size: 60px;
            margin: 30px 0 18px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #000000;
            border-bottom: 3px solid #333;
            display: inline-block;
            padding-bottom: 8px;
        }

        /* 信息文字 */
        .info {
            font-size: 40px;
            margin: 16px 0;
            font-weight: normal;
        }

        /* 悼词专区 */
        .message {
            font-size: 28px;
            margin: 40px 0;
            padding: 28px 20px;
            border-top: 3px solid #000000;
            border-bottom: 3px solid #000000;
            background-color: rgba(0, 0, 0, 0.02);
            font-weight: 500;
            line-height: 1.9;
        }

        /* 丧葬仪式信息模块 */
        .ceremony-info {
            margin-top: 20px;
            background-color: rgba(0, 0, 0, 0.04);
            padding: 18px;
            border-left: 6px solid #000000;
            border-right: 6px solid #000000;
        }

        /* 落款 */
        .footer {
            font-size: 24px;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 2px dashed #444;
        }

        /* 响应式布局 */
        @media (max-width: 760px) {
            .container {
                padding: 0px 12px 40px 12px;
            }
            .top-banner {
                width: calc(100% + 24px);
                margin-left: -12px;
                margin-right: -12px;
            }
            .dian-zi {
                font-size: 100px;
                letter-spacing: 8px;
            }
            .portrait {
                width: 240px;
                height: 320px;
                border-width: 8px;
            }
            .wreath {
                width: 140px;
            }
            .title {
                font-size: 50px;
            }
            .info {
                font-size: 20px;
            }
            .message {
                font-size: 22px;
                padding: 18px;
            }
            .footer {
                font-size: 18px;
            }
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .dian-zi {
            font-family: "SimHei", "黑体", "Microsoft YaHei", serif;
        }
    </style>
</head>

<script>
    const audioEl = document.getElementById('funeralAudio');

    let isPlaying = false;

    function toggleAudio() {
        if (isPlaying) {
            audioEl.pause();
           ;
        } else {
            audioEl.play();
          ;
        }
        isPlaying = !isPlaying;
    }

    audioEl.addEventListener('ended', function() {
        isPlaying = false;
        ;
    });
</script>
