# ========================================
# Netlify 配置文件 - 让网页游戏飞起来
# ========================================

# 基础设置：发布目录（当前根目录）
[build]
  publish = "."

# ========================================
# 缓存策略：让图片、JS、CSS 缓存1年
# ========================================

# 图片缓存（1年）
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JS 和 CSS 缓存（1年）
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 字体文件缓存（1年）
[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML 文件不缓存（确保用户总是看到最新版本）
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 首页（/）也不缓存
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ========================================
# 重定向规则（可选：把 http 强制跳转到 https）
# ========================================

[[redirects]]
  from = "http://*"
  to = "https://*"
  status = 301
  force = true

# ========================================
# 图片自动优化开关
# ========================================

[build.processing]
  skip_processing = false

[build.processing.images]
  compress = true
  quality = 80