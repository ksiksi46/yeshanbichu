        function performSearch() {
    var urlParams = new URLSearchParams(window.location.search);
    var keyword = urlParams.get('keyword');
    
    if (!keyword || keyword.trim() === '') {
        keyword = '';
    }
    
    var container = document.getElementById('search-result-container');
    var result = SEARCH_DATA[keyword];
    
    var searchInfo = '<div class="search-info">🔍 您搜索的关键词：<strong>' + escapeHtml(keyword) + '</strong></div>';
    
    if (result) {
        var resultHtml = searchInfo + '<div class="result-list">';
        
        // 判断是否为数组（多条结果）
        if (Array.isArray(result)) {
            for (var i = 0; i < result.length; i++) {
                var item = result[i];
                resultHtml += '<div class="result-item">';
                resultHtml += '<h3><a href="' + item.url + '">' + escapeHtml(item.title) + '</a></h3>';
                resultHtml += '<p>' + escapeHtml(item.description) + '</p>';
                resultHtml += '<div class="url">' + item.url + '</div>';
                resultHtml += '</div>';
            }
        } else {
            // 单条结果
            resultHtml += '<div class="result-item">';
            resultHtml += '<h3><a href="' + result.url + '">' + escapeHtml(result.title) + '</a></h3>';
            resultHtml += '<p>' + escapeHtml(result.description) + '</p>';
            resultHtml += '<div class="url">' + result.url + '</div>';
            resultHtml += '</div>';
        }
        
        resultHtml += '</div>';
        container.innerHTML = resultHtml;
    } else if (keyword === '') {
        container.innerHTML = '<div class="no-result"><p>⚠ 请输入搜索关键词</p><a href="cwh.html">返回首页</a></div>';
    } else {
        container.innerHTML = searchInfo + '<div class="no-result"><p>❌ 未找到与“' + escapeHtml(keyword) + '”相关的结果</p><a href="cwh.html">返回首页</a></div>';
    }
}
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
