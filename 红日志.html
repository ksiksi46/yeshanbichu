<html lang="zh">
<head>
    <meta charset="gb2312">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邺山面馆 - 日志系统</title>
    <audio id="bgMusic" loop src="红音乐.mp3"></audio>
    <style type="text/css">
        /* 全局样式 - 20年前怀旧风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            /* 纯高饱和红色背景，类似老式惊悚网页底色 */
            background-color: #5f0606;
            font-family: "宋体", "SimSun", "MS Sans Serif", serif;
            padding: 0;
            min-height: 100vh;
        }
        
        /* 主容器 - 相对布局，用于内容居中 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px 20px 30px 20px;
        }
        
       /* 顶部图片区域 - 铺满左右屏幕，高度自动适应图片比例 */
        .top-image-area {
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            margin-top: 0;
            margin-bottom: 30px;
            background: #5f0606;  /* 改为与body背景一致的红色，避免突兀色块 */
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            line-height: 0;
        }
        .top-image {
            width: 100%;
            max-height: 1000px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        /* 抖动动画 (怀旧小特效) */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        
        /* 闪烁动画 (延续原有) */
        @keyframes flicker {
            0% { opacity: 1; filter: brightness(1); }
            92% { opacity: 1; filter: brightness(1); }
            93% { opacity: 0.6; filter: brightness(0.85); }
            94% { opacity: 0.9; filter: brightness(0.95); }
            95% { opacity: 0.5; filter: brightness(0.8); }
            96% { opacity: 0.95; filter: brightness(0.98); }
            97% { opacity: 0.7; filter: brightness(0.9); }
            98% { opacity: 1; filter: brightness(1); }
            100% { opacity: 1; filter: brightness(1); }
        }
        
        .shake-effect {
            animation: shake 0.15s ease-in-out 0s 2;
        }
        
        .flicker-effect {
            animation: flicker 3s infinite;
        }
        
        /* 日志框 - 符纸背景保留原样 */
        .log-box {
            background: #FFFEF0;
            border: 3px solid #e70505;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,200,0.8);
            margin: 0;
            position: relative;
        }
        
        /* 符纸纹理效果继续保留 */
        .paper-bg {
            background: #290101;
            background-image: 
                repeating-linear-gradient(
                    transparent 0px,
                    transparent 2px,
                    rgba(160, 120, 60, 0.08) 2px,
                    rgba(160, 120, 60, 0.08) 4px
                ),
                radial-gradient(circle at 10% 20%, rgba(200, 160, 80, 0.1) 0%, transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(200, 160, 80, 0.1) 0%, transparent 30%);
            border: 2px solid #C9A96E;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.3), inset 0 0 30px rgba(210, 170, 80, 0.2);
            position: relative;
        }
        
        .paper-bg::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 15px;
            width: 80px;
            height: 80px;
            background: radial-gradient(ellipse, rgba(200,160,80,0.2) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .paper-bg::after {
            content: "";
            position: absolute;
            bottom: 10px;
            right: 15px;
            width: 80px;
            height: 80px;
            background: radial-gradient(ellipse, rgba(200,160,80,0.2) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .log-header {
            background: #290101;
            background: linear-gradient(to bottom, #c60303, #2f0201);
            padding: 12px 20px;
            border-bottom: 2px solid #ea4f2f;
            color: #000000;
            font-size: 18px;
            font-weight: bold;
            font-family: "黑体", "SimHei", "MS Sans Serif", sans-serif;
            text-shadow: 1px 1px 0 #330202;
            letter-spacing: 2px;
        }
        
        /* ====== 修改部分：日志列表样式 ====== */
        .log-list {
            padding: 5px 0;
            max-height: 480px;
            overflow-y: auto;
        }
        
        /* 日志条目 - 血红色字体、加粗、字号调大 */
        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            border-bottom: 1px solid #D4B87A;
            transition: background 0.15s;
            cursor: pointer;
            background-color: #FFFEF5;
        }
        
        .log-item:hover {
            background-color: #FFE0E0;
        }
        
        /* 日志标题：血红色、加粗、字号加大 */
        .log-title {
            font-size: 16px;           /* 原14px，调大 */
            font-weight: bold;          /* 加粗 */
            color: #cc1111;             /* 血红色 */
            font-family: "宋体", "SimSun", "MS Sans Serif", serif;
            letter-spacing: 1px;
            flex: 1;
        }
        
        /* 日志时间：血红色、加粗、字号加大 */
        .log-time {
            font-size: 13px;            /* 原11px，调大 */
            font-weight: bold;          /* 加粗 */
            color: #cc1111;             /* 血红色 */
            font-family: "Courier New", "宋体", monospace;
            background: #F0E5D2;
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid #C3A35C;
            white-space: nowrap;
        }
        
        /* 左右侧边栏: 各5个图片从上到下排列 */
        .side-deco-column {
            width: 95px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
        }
        
        .side-img-item {
            width: 100%;
            text-align: center;
            transition: transform 0.2s;
            cursor: pointer;
        }
        
        .side-img-item img {
            width: 100%;
            height: 100px;
            border: none;
            display: block;
            margin: 0 auto;
        }
        
        .side-img-item img:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        
        /* 点亮效果：增加发光和边框 */
        .side-img-item.lit img {
            filter: brightness(1.2) drop-shadow(0 0 8px #FFD700);
            border-radius: 50%;
            box-shadow: 0 0 12px 3px #FFAA00, 0 0 5px 1px #FFD700;
            transform: scale(1.02);
        }
        
        /* 中间日志区域自适应 */
        .main-content {
            flex: 1;
            min-width: 0;
        }
        
        .flex-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
        }
        
        /* 返回按钮 - 保持原有古朴样式 */
        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 8px 24px;
            background: #8B4513;
            color: #FFD700;
            text-decoration: none;
            border: 2px outset #CD853F;
            font-family: "宋体", "SimSun", serif;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        
        .back-btn:active {
            border: 2px inset #CD853F;
        }
        
        /* 滚动条样式保持怀旧 */
        .log-list::-webkit-scrollbar {
            width: 8px;
        }
        
        .log-list::-webkit-scrollbar-track {
            background: #F5E8C8;
            border-radius: 4px;
        }
        
        .log-list::-webkit-scrollbar-thumb {
            background: #B8860B;
            border-radius: 4px;
        }
        
        .empty-log {
            text-align: center;
            padding: 50px;
            color: #17f603;
            font-size: 14px;
        }
        
        /* 调整容器内部边距 */
        @media (max-width: 780px) {
            .side-deco-column {
                width: 70px;
                gap: 12px;
            }
            .log-title {
                font-size: 14px;
            }
            .log-time {
                font-size: 11px;
                padding: 2px 6px;
            }
            .flex-row {
                gap: 12px;
            }
        }
        
        /* 顶部图片完全铺满左右而不留白，修正body边距 */
        body {
            overflow-x: hidden;
        }
        /* 浮层文本样式 - 血红色字体 */
.modal-log-text {
    color: #cc1111;
    font-weight: bold;
    font-size: 15px;
    line-height: 1.8;
}
    </style>

// 顶部图片无限抖动效果
let shakeInterval = null;

function startContinuousShake() {
    const img = document.getElementById('topImage');
    if (!img) return;
    
    img.style.transition = 'none';
    img.style.willChange = 'transform, filter, opacity';
    
    function doShake() {
        if (!img) return;
        
        const intensity = 2.5;
        const rotIntensity = 1.5;
        
        const x = (Math.random() - 0.5) * intensity * 3;
        const y = (Math.random() - 0.5) * intensity * 2.5;
        const rot = (Math.random() - 0.5) * rotIntensity;
        const skewX = (Math.random() - 0.5) * 2;
        const skewY = (Math.random() - 0.5) * 2;
        
        img.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) skew(${skewX}deg, ${skewY}deg)`;
        
        const flicker = Math.random();
        if (flicker < 0.25) {
            img.style.filter = 'brightness(1.6) contrast(1.4)';
        } else if (flicker < 0.5) {
            img.style.filter = 'brightness(0.65) contrast(0.75)';
        } else if (flicker < 0.75) {
            img.style.filter = 'brightness(1.2) saturation(1.3) hue-rotate(5deg)';
        } else {
            img.style.filter = 'brightness(1) contrast(1)';
        }
        
        if (Math.random() < 0.12) {
            img.style.opacity = '0.8';
        } else {
            img.style.opacity = '1';
        }
    }
    
    shakeInterval = setInterval(doShake, 30);
}

// 停止抖动（可选，用于页面离开时清理）
function stopContinuousShake() {
    if (shakeInterval) {
        clearInterval(shakeInterval);
        shakeInterval = null;
    }
    const img = document.getElementById('topImage');
    if (img) {
        img.style.transform = '';
        img.style.filter = '';
        img.style.opacity = '';
    }
}

// 页面卸载时停止抖动
window.addEventListener('beforeunload', function() {
    stopContinuousShake();
});

        audio.play().catch(function(error) {
            console.log('自动播放被浏览器阻止，点击页面任意位置后播放');
            document.body.addEventListener('click', function playOnce() {
                audio.play();
                document.body.removeEventListener('click', playOnce);
            });
        });
    }
    
    // 顶部图片加载失败处理
    const topImg = document.getElementById('topImage');
    if (topImg) {
        topImg.onerror = function() {
            this.style.backgroundColor = "#8B4513";
            this.style.minHeight = "120px";
            this.alt = "邺山面馆匾额";
        };
    }
    
    // 左右图片批量防错
    const allSideImgs = document.querySelectorAll('.side-img-item img');
    for (let i = 0; i < allSideImgs.length; i++) {
        allSideImgs[i].onerror = function() {
            if (!this.complete) return;
            this.style.width = "60px";
            this.style.height = "60px";
            this.style.backgroundColor = "#E0B873";
            this.style.border = "1px solid #a56b2f";
        };
    }
    
    console.log("==== 邺山面馆日志系统载入 ====");
    console.log("当前日志条目: " + logs.length + " 条");
    console.log("无限抖动已启动！");
};

    return false;
};
