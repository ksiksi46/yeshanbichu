<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone · 公众号</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 手机容器 */
        .phone-container {
            width: 420px;
            height: 800px;
            background: #fff;
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3), 0 0 0 8px #ddd;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 听筒区域 */
        .dynamic-island {
            background: #f5f5f5;
            height: 40px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .speaker {
            width: 120px;
            height: 30px;
            background: #e0e0e0;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .speaker-dot {
            width: 8px;
            height: 8px;
            background: #ccc;
            border-radius: 50%;
        }

        .camera {
            width: 12px;
            height: 12px;
            background: #b0b0b0;
            border-radius: 50%;
            margin-left: 5px;
        }

        /* 顶部状态栏 */
        .status-bar {
            background: #f5f5f5;
            color: #333;
            padding: 8px 24px 4px;
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid #eee;
        }

        /* 主屏幕壁纸 - 浅色清新 */
        .home-screen {
            flex: 1;
            background: linear-gradient(145deg, #f5f7fa, #eef2f5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        /* 返回按钮区域 */
        .nav-back {
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .back-btn {
            font-size: 28px;
            cursor: pointer;
            color: #07C160;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-text {
            font-size: 17px;
            color: #07C160;
            cursor: pointer;
        }
        .nav-title {
            flex: 1;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
            margin-right: 60px;
        }

        /* 公众号内容容器 - 完全适配手机宽度 */
        .oa-content {
            flex: 1;
            overflow-y: auto;
            background-color: #f7f7f7;
        }

        /* 以下为公众号页面样式，完全保留原设计并适配手机 */
        .container {
            max-width: 100%;
            background-color: #fff;
            min-height: 100%;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }
        
        .header-left {
            font-size: 20px;
            font-weight: 600;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        
        .icon-btn {
            font-size: 20px;
            position: relative;
        }
        
        .notification-dot {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 8px;
            height: 8px;
            background-color: #ff3b30;
            border-radius: 50%;
        }
        
        .account-nav {
            display: flex;
            padding: 12px 15px;
            background-color: #f7f7f7;
            gap: 24px;
            overflow-x: auto;
            scrollbar-width: thin;
        }
        
        .account-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }
        
        .account-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
            border: 1px solid #eee;
            overflow: hidden;
        }
        
        .account-avatar img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .account-name {
            font-size: 11px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .online-status {
            width: 6px;
            height: 6px;
            background-color: #07c160;
            border-radius: 50%;
        }
        
        .article-list {
            padding: 0 15px;
        }
        
        .article-item {
            display: flex;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.1s;
        }
        .article-item:active {
            background: #f5f5f5;
        }
        
        .article-left {
            flex: 1;
        }
        
        .article-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .article-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            margin-right: 8px;
            overflow: hidden;
            background: #fff;
        }
        
        .article-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .article-info {
            flex: 1;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
        }
        
        .article-source {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        
        .article-time {
            font-size: 11px;
            color: #999;
            margin-left: 8px;
        }
        
        .article-title {
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #222;
            font-weight: 500;
        }
        
        .article-more {
            font-size: 12px;
            color: #999;
        }
        
        .article-right {
            width: 100px;
            margin-left: 12px;
        }
        
        .article-image {
            width: 100%;
            height: 70px;
            background-color: #eee;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .blue-tag {
            background-color: #2b5aac;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            height: 100%;
        }

        /* 文章详情浮层 */
        .article-detail-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            z-index: 200;
            display: none;
            flex-direction: column;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .detail-header {
            background: #fff;
            padding: 50px 16px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
        }
        .detail-back {
            font-size: 28px;
            cursor: pointer;
            color: #07C160;
        }
        .detail-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }
        .detail-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            line-height: 1.6;
            color: #333;
            font-size: 16px;
        }
    </style>
</head>

<script>
    // 手机框架提示：返回按钮仅用于关闭详情或回到框架初始状态（无实际跳转）
    const fakeBackBtn = document.getElementById('fakeBackBtn');
    const fakeBackText = document.getElementById('fakeBackText');
    
    // 如果点击返回，显示轻提示——因为是纯展示框架，不做页面跳转
    function showFrameworkTip() {
        let tip = document.createElement('div');
        tip.innerText = '公众号内容已嵌入手机框架';
        tip.style.cssText = `
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 10000;
            white-space: nowrap;
        `;
        document.body.appendChild(tip);
        setTimeout(() => tip.remove(), 1500);
    }
    
    if (fakeBackBtn) {
        fakeBackBtn.addEventListener('click', showFrameworkTip);
    }
    if (fakeBackText) {
        fakeBackText.addEventListener('click', showFrameworkTip);
    }
    
    // 文章点击显示详情
    const articleItems = document.querySelectorAll('.article-item');
    const detailOverlay = document.getElementById('articleDetailOverlay');
    const detailTitle = document.getElementById('detailTitle');
    const detailContentDiv = document.getElementById('detailContent');
    const closeDetailBtn = document.getElementById('closeDetailBtn');
    
    articleItems.forEach(item => {
        item.addEventListener('click', function(e) {
            e.stopPropagation();
            const title = this.getAttribute('data-title') || this.querySelector('.article-title')?.innerText || '文章';
            const content = this.getAttribute('data-content') || '暂无详细内容，请稍后查看。';
            detailTitle.innerText = title.length > 22 ? title.slice(0,22) + '...' : title;
            detailContentDiv.innerHTML = `
                <div style="font-size:18px; font-weight:600; margin-bottom:16px; color:#07C160;">${title}</div>
                <div style="line-height:1.7; font-size:16px;">${content}</div>
                <div style="margin-top:24px; padding-top:16px; border-top:1px solid #eee; color:#999; font-size:13px;">阅读原文 </div>
            `;
            detailOverlay.style.display = 'flex';
        });
    });
    
    // 关闭详情
    if (closeDetailBtn) {
        closeDetailBtn.addEventListener('click', function() {
            detailOverlay.style.display = 'none';
        });
    }
    
    // 点击遮罩关闭（可选）
    detailOverlay.addEventListener('click', function(e) {
        if (e.target === detailOverlay) {
            detailOverlay.style.display = 'none';
        }
    });
    
    // 公众号内图标提示（保留原质感，轻提示）
    const iconBtns = document.querySelectorAll('.icon-btn, .account-item');
    iconBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            let tip = document.createElement('div');
            tip.innerText = '手机框架演示，功能未开放';
            tip.style.cssText = `
                position: fixed;
                bottom: 120px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.7);
                color: white;
                padding: 6px 14px;
                border-radius: 20px;
                font-size: 12px;
                z-index: 10001;
                white-space: nowrap;
            `;
            document.body.appendChild(tip);
            setTimeout(() => tip.remove(), 1000);
        });
    });
    
    // 阻止文章列表内事件冒泡引起的多余提示
    const articleListContainer = document.getElementById('articleListContainer');
    if (articleListContainer) {
        articleListContainer.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    }
</script>
</body>
</html>
